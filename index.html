<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      width: 1920px;
      height: 1080px;
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    /* Fixed container positioned at the bottom row */
    .overlay-container {
      position: absolute;
      left: 50%;
      bottom: 40px;
      transform: translateX(-50%);
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 30px;
      pointer-events: none;
      color: #FFFFFF;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9), 0 0 10px rgba(0, 0, 0, 0.7);
    }

    /* Weather & Location group */
    .weather-location-group {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 20px;
      white-space: nowrap;
    }

    .weather-icon-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 74.8px;
      height: 74.8px;
    }

    .weather-icon-wrapper svg {
      width: 74.8px;
      height: 74.8px;
      filter: drop-shadow(3px 3px 6px rgba(0, 0, 0, 0.9));
    }

    .temperature {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 81.6px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -1px;
    }

    .location-details {
      display: flex;
      flex-direction: column;
      justify-content: center;
      line-height: 1.2;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin-left: 4px;
    }

    .city-name {
      font-size: 32px;
      font-weight: 700;
      color: #FFFFFF;
    }

    .condition-desc {
      font-size: 22px;
      font-weight: 500;
      color: #E2E8F0;
    }

    /* Date and Time side by side on bottom row */
    .datetime-text {
      font-family: 'Oswald', -apple-system, BlinkMacSystemFont, "Arial Narrow", sans-serif;
      font-size: 54px;
      font-weight: 600;
      letter-spacing: 0.5px;
      line-height: 1;
      text-transform: uppercase;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div class="overlay-container">
    <div class="weather-location-group">
      <div id="weather-icon" class="weather-icon-wrapper">
        <svg viewBox="0 0 24 24"><path fill="#CBD5E1" d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>
      </div>
      <div id="temperature" class="temperature">--°F</div>
      <div class="location-details">
        <div id="city-name" class="city-name">Detecting...</div>
        <div id="condition-desc" class="condition-desc">Please wait</div>
      </div>
    </div>
    <div id="clock" class="datetime-text">Loading...</div>
  </div>

  <script>
    const MAJOR_METROS = [
      { name: "Los Angeles", fullName: "Los Angeles, CA", lat: 34.0522, lon: -118.2437 },
      { name: "Las Vegas", fullName: "Las Vegas, NV", lat: 36.1699, lon: -115.1398 },
      { name: "Phoenix", fullName: "Phoenix, AZ", lat: 33.4484, lon: -112.0740 },
      { name: "San Diego", fullName: "San Diego, CA", lat: 32.7157, lon: -117.1611 },
      { name: "San Francisco", fullName: "San Francisco, CA", lat: 37.7749, lon: -122.4194 },
      { name: "Seattle", fullName: "Seattle, WA", lat: 47.6062, lon: -122.3321 },
      { name: "Portland", fullName: "Portland, OR", lat: 45.5152, lon: -122.6784 },
      { name: "Denver", fullName: "Denver, CO", lat: 39.7392, lon: -104.9903 },
      { name: "Dallas", fullName: "Dallas, TX", lat: 32.7767, lon: -96.7970 },
      { name: "Austin", fullName: "Austin, TX", lat: 30.2672, lon: -97.7431 },
      { name: "Houston", fullName: "Houston, TX", lat: 29.7604, lon: -95.3698 },
      { name: "Chicago", fullName: "Chicago, IL", lat: 41.8781, lon: -87.6298 },
      { name: "Miami", fullName: "Miami, FL", lat: 25.7617, lon: -80.1918 },
      { name: "Atlanta", fullName: "Atlanta, GA", lat: 33.7490, lon: -84.3880 },
      { name: "New York", fullName: "New York, NY", lat: 40.7128, lon: -74.0060 }
    ];

    const ICON_SUN = `<svg viewBox="0 0 24 24"><path fill="#FBBF24" d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>`;
    const ICON_PARTLY_CLOUDY = `<svg viewBox="0 0 24 24"><path fill="#FBBF24" d="M12.5 3a1 1 0 0 1 1 1v1.5a1 1 0 1 1-2 0V4a1 1 0 0 1 1-1zm6.01 2.49a1 1 0 0 1 0 1.41l-1.06 1.06a1 1 0 1 1-1.41-1.41l1.06-1.06a1 1 0 0 1 1.41 0zM21 11a1 1 0 0 1 1 1c0 .55-.45 1-1 1h-1.5a1 1 0 1 1 0-2H21zM7.9 6.9a1 1 0 0 0-1.41-1.41l-1.06 1.06a1 1 0 1 0 1.41 1.41l1.06-1.06zM13 7a5 5 0 0 1 4.58 3.01 5.5 5.5 0 0 0-5.58 5.49h-.5a5 5 0 0 1 0-10z"/><path fill="#E2E8F0" d="M19.35 11.04C18.67 8.59 16.14 7 13.5 7c-2.3 0-4.3 1.25-5.2 3.1A4.5 4.5 0 0 0 4 14.5C4 16.98 6.02 19 8.5 19h10.5c2.21 0 4-1.79 4-4 0-1.95-1.4-3.57-3.25-3.92-.12-.02-.27-.04-.4-.04z"/></svg>`;
    const ICON_CLOUD = `<svg viewBox="0 0 24 24"><path fill="#94A3B8" d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>`;
    const ICON_FOG = `<svg viewBox="0 0 24 24"><path fill="#CBD5E1" d="M3 8h18v2.5H3zm0 4h18v2.5H3zm3 4h12v2.5H6z"/></svg>`;
    const ICON_RAIN = `<svg viewBox="0 0 24 24"><path fill="#94A3B8" d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/><path fill="#38BDF8" d="M8 21c-.55 0-1-.45-1-1 0-.55 1-2 1-2s1 1.45 1 2c0 .55-.45 1-1 1zm4 0c-.55 0-1-.45-1-1 0-.55 1-2 1-2s1 1.45 1 2c0 .55-.45 1-1 1zm4 0c-.55 0-1-.45-1-1 0-.55 1-2 1-2s1 1.45 1 2c0 .55-.45 1-1 1z"/></svg>`;
    const ICON_SNOW = `<svg viewBox="0 0 24 24"><path fill="#94A3B8" d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/><circle cx="8" cy="18" r="1.5" fill="#E0F2FE"/><circle cx="12" cy="20" r="1.5" fill="#E0F2FE"/><circle cx="16" cy="18" r="1.5" fill="#E0F2FE"/></svg>`;
    const ICON_STORM = `<svg viewBox="0 0 24 24"><path fill="#64748B" d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/><path fill="#FACC15" d="M12 13l-2.5 5h3l-1.5 5 4.5-6.5h-3.5z"/></svg>`;

    const WEATHER_INFO = {
      0: { desc: "Clear Sky", icon: ICON_SUN },
      1: { desc: "Mainly Clear", icon: ICON_PARTLY_CLOUDY },
      2: { desc: "Partly Cloudy", icon: ICON_PARTLY_CLOUDY },
      3: { desc: "Overcast Clouds", icon: ICON_CLOUD },
      45: { desc: "Fog", icon: ICON_FOG },
      48: { desc: "Depositing Rime Fog", icon: ICON_FOG },
      51: { desc: "Light Drizzle", icon: ICON_RAIN },
      53: { desc: "Moderate Drizzle", icon: ICON_RAIN },
      55: { desc: "Dense Drizzle", icon: ICON_RAIN },
      61: { desc: "Slight Rain", icon: ICON_RAIN },
      63: { desc: "Moderate Rain", icon: ICON_RAIN },
      65: { desc: "Heavy Rain", icon: ICON_RAIN },
      71: { desc: "Slight Snow", icon: ICON_SNOW },
      73: { desc: "Moderate Snow", icon: ICON_SNOW },
      75: { desc: "Heavy Snow", icon: ICON_SNOW },
      80: { desc: "Rain Showers", icon: ICON_RAIN },
      81: { desc: "Moderate Rain Showers", icon: ICON_RAIN },
      82: { desc: "Violent Rain Showers", icon: ICON_RAIN },
      95: { desc: "Thunderstorm", icon: ICON_STORM },
      96: { desc: "Thunderstorm with Hail", icon: ICON_STORM },
      99: { desc: "Heavy Thunderstorm with Hail", icon: ICON_STORM }
    };

    const DEFAULT_WEATHER = {
      desc: "Overcast Clouds",
      icon: ICON_CLOUD
    };

    function getWeatherInfo(code) {
      return WEATHER_INFO[code] || DEFAULT_WEATHER;
    }

    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function getNearestMetro(lat, lon) {
      let closest = MAJOR_METROS[0];
      let minDistance = Infinity;
      for (const metro of MAJOR_METROS) {
        const dist = getDistance(lat, lon, metro.lat, metro.lon);
        if (dist < minDistance) {
          minDistance = dist;
          closest = metro;
        }
      }
      return closest;
    }

    // URL parameters support (e.g. ?unit=C or unit=F)
    const urlParams = new URLSearchParams(window.location.search);
    const unitParam = (urlParams.get('unit') || 'F').toUpperCase();
    const isFahrenheit = unitParam !== 'C';

    // Clock formatted: THU, 05 NOV 2026, 02:12 PM
    function updateClock() {
      const now = new Date();
      const days = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
      const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];

      const dayName = days[now.getDay()];
      const d = String(now.getDate()).padStart(2, '0');
      const m = months[now.getMonth()];
      const y = now.getFullYear();

      let hours = now.getHours();
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12;
      const hStr = String(hours).padStart(2, '0');
      const minStr = String(now.getMinutes()).padStart(2, '0');

      document.getElementById('clock').textContent = `${dayName}, ${d} ${m} ${y}, ${hStr}:${minStr} ${ampm}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    async function displayMetroWeather(metro) {
      document.getElementById('city-name').textContent = metro.name;
      try {
        const tempUnitApi = isFahrenheit ? 'fahrenheit' : 'celsius';
        const weatherRes = await fetch(
          `https://api.open-meteo.com/v1/forecast?latitude=${metro.lat}&longitude=${metro.lon}&current=temperature_2m,weather_code&temperature_unit=${tempUnitApi}`
        );
        const weatherData = await weatherRes.json();
        const temp = Math.round(weatherData.current.temperature_2m);
        const info = getWeatherInfo(weatherData.current.weather_code);
        document.getElementById('weather-icon').innerHTML = info.icon;
        document.getElementById('temperature').textContent = `${temp}°${isFahrenheit ? 'F' : 'C'}`;
        document.getElementById('condition-desc').textContent = info.desc;
      } catch (e) {
        document.getElementById('temperature').textContent = `--°${isFahrenheit ? 'F' : 'C'}`;
        document.getElementById('condition-desc').textContent = "Weather Unavailable";
      }
    }

    async function resolveViaWiFiOrIP() {
      try {
        const res = await fetch("https://ipwho.is/");
        const data = await res.json();
        if (data && data.success && data.latitude && data.longitude) {
          const metro = getNearestMetro(data.latitude, data.longitude);
          displayMetroWeather(metro);
          return;
        }
      } catch (err) {
        console.warn("Wi-Fi/IP lookup failed:", err);
      }
      displayMetroWeather(MAJOR_METROS[0]);
    }

    function updateLocationAndWeather() {
      if (!navigator.geolocation) {
        resolveViaWiFiOrIP();
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          const metro = getNearestMetro(lat, lon);
          displayMetroWeather(metro);
        },
        () => {
          resolveViaWiFiOrIP();
        },
        {
          enableHighAccuracy: false,
          timeout: 6000,
          maximumAge: 600000
        }
      );
    }

    updateLocationAndWeather();
    setInterval(updateLocationAndWeather, 600000);
  </script>
</body>
</html>
