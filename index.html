<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      width: 1920px;
      height: 1080px;
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    /* Fixed container positioned at the bottom row */
    .overlay-container {
      position: absolute;
      left: 50px;
      bottom: 40px;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 20px;
      pointer-events: none;
      color: #FFFFFF;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.9), 0 0 8px rgba(0, 0, 0, 0.7);
    }

    /* Weather & Location group */
    .weather-location-group {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .weather-icon-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
    }

    .weather-icon-wrapper svg {
      width: 16px;
      height: 16px;
      fill: #FFFFFF;
      filter: drop-shadow(1px 1px 2px rgba(0, 0, 0, 0.9));
    }

    .temperature {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 20px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.3px;
    }

    .location-details {
      display: flex;
      flex-direction: column;
      justify-content: center;
      line-height: 1.15;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin-left: 1px;
    }

    .city-name {
      font-size: 11px;
      font-weight: 700;
      color: #FFFFFF;
    }

    .condition-desc {
      font-size: 8.5px;
      font-weight: 500;
      color: #E2E8F0;
    }

    /* Date and Time side by side on bottom row */
    .datetime-text {
      font-family: 'Oswald', -apple-system, BlinkMacSystemFont, "Arial Narrow", sans-serif;
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 0.5px;
      line-height: 1;
      text-transform: uppercase;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div class="overlay-container">
    <div class="weather-location-group">
      <div id="weather-icon" class="weather-icon-wrapper">
        <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>
      </div>
      <div id="temperature" class="temperature">--°C</div>
      <div class="location-details">
        <div id="city-name" class="city-name">Detecting...</div>
        <div id="condition-desc" class="condition-desc">Please wait</div>
      </div>
    </div>
    <div id="clock" class="datetime-text">Loading...</div>
  </div>

  <script>
    const MAJOR_METROS = [
      { name: "Los Angeles", fullName: "Los Angeles, CA", lat: 34.0522, lon: -118.2437 },
      { name: "Las Vegas", fullName: "Las Vegas, NV", lat: 36.1699, lon: -115.1398 },
      { name: "Phoenix", fullName: "Phoenix, AZ", lat: 33.4484, lon: -112.0740 },

    const WEATHER_INFO = {
      0: { desc: "Clear Sky", icon: `<svg viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>` },
      1: { desc: "Mainly Clear", icon: `<svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>` },
      2: { desc: "Partly Cloudy", icon: `<svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>` },

      45: { desc: "Fog", icon: `<svg viewBox="0 0 24 24"><path d="M3 9h18v2H3zm0 4h18v2H3zm3 4h12v2H6z"/></svg>` },
      48: { desc: "Depositing Rime Fog", icon: `<svg viewBox="0 0 24 24"><path d="M3 9h18v2H3zm0 4h18v2H3zm3 4h12v2H6z"/></svg>` },
      51: { desc: "Light Drizzle", icon: `<svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM9 21.5c-.83 0-1.5-.67-1.5-1.5 0-.83 1.5-3 1.5-3s1.5 2.17 1.5 3c0 .83-.67 1.5-1.5 1.5zm6 0c-.83 0-1.5-.67-1.5-1.5 0-.83 1.5-3 1.5-3s1.5 2.17 1.5 3c0 .83-.67 1.5-1.5 1.5z"/></svg>` },
      53: { desc: "Moderate Drizzle", icon: `<svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM9 21.5c-.83 0-1.5-.67-1.5-1.5 0-.83 1.5-3 1.5-3s1.5 2.17 1.5 3c0 .83-.67 1.5-1.5 1.5zm6 0c-.83 0-1.5-.67-1.5-1.5 0-.83 1.5-3 1.5-3s1.5 2.17 1.5 3c0 .83-.67 1.5-1.5 1.5z"/></svg>` },
      55: { desc: "Dense Drizzle", icon: `<svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM9 21.5c-.83 0-1.5-.67-1.5-1.5 0-.83 1.5-3 1.5-3s1.5 2.17 1.5 3c0 .83-.67 1.5-1.5 1.5zm6 0c-.83 0-1.5-.67-1.5-1.5 0-.83 1.5-3 1.5-3s1.5 2.17 1.5 3c0 .83-.67 1.5-1.5 1.5z"/></svg>` },
      61: { desc: "Slight Rain", icon: `<svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM9 21.5c-.83 0-1.5-.67-1.5-1.5 0-.83 1.5-3 1.5-3s1.5 2.17 1.5 3c0 .83-.67 1.5-1.5 1.5zm6 0c-.83 0-1.5-.67-1.5-1.5 0-.83 1.5-3 1.5-3s1.5 2.17 1.5 3c0 .83-.67 1.5-1.5 1.5z"/></svg>` },
      63: { desc: "Moderate Rain", icon: `<svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM9 21.5c-.83 0-1.5-.67-1.5-1.5 0-.83 1.5-3 1.5-3s1.5 2.17 1.5 3c0 .83-.67 1.5-1.5 1.5zm6 0c-.83 0-1.5-.67-1.5-1.5 0-.83 1.5-3 1.5-3s1.5 2.17 1.5 3c0 .83-.67 1.5-1.5 1.5z"/></svg>` },
      65: { desc: "Heavy Rain", icon: `<svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM9 21.5c-.83 0-1.5-.67-1.5-1.5 0-.83 1.5-3 1.5-3s1.5 2.17 1.5 3c0 .83-.67 1.5-1.5 1.5zm6 0c-.83 0-1.5-.67-1.5-1.5 0-.83 1.5-3 1.5-3s1.5 2.17 1.5 3c0 .83-.67 1.5-1.5 1.5z"/></svg>` },
      71: { desc: "Slight Snow", icon: `<svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>` },
      73: { desc: "Moderate Snow", icon: `<svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>` },
      75: { desc: "Heavy Snow", icon: `<svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>` },
      80: { desc: "Rain Showers", icon: `<svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM9 21.5c-.83 0-1.5-.67-1.5-1.5 0-.83 1.5-3 1.5-3s1.5 2.17 1.5 3c0 .83-.67 1.5-1.5 1.5zm6 0c-.83 0-1.5-.67-1.5-1.5 0-.83 1.5-3 1.5-3s1.5 2.17 1.5 3c0 .83-.67 1.5-1.5 1.5z"/></svg>` },
      81: { desc: "Moderate Rain Showers", icon: `<svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM9 21.5c-.83 0-1.5-.67-1.5-1.5 0-.83 1.5-3 1.5-3s1.5 2.17 1.5 3c0 .83-.67 1.5-1.5 1.5zm6 0c-.83 0-1.5-.67-1.5-1.5 0-.83 1.5-3 1.5-3s1.5 2.17 1.5 3c0 .83-.67 1.5-1.5 1.5z"/></svg>` },
      82: { desc: "Violent Rain Showers", icon: `<svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM9 21.5c-.83 0-1.5-.67-1.5-1.5 0-.83 1.5-3 1.5-3s1.5 2.17 1.5 3c0 .83-.67 1.5-1.5 1.5zm6 0c-.83 0-1.5-.67-1.5-1.5 0-.83 1.5-3 1.5-3s1.5 2.17 1.5 3c0 .83-.67 1.5-1.5 1.5z"/></svg>` },
      95: { desc: "Thunderstorm", icon: `<svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM11.5 22l2.5-5h-3l2-5h-2.5l-2 5h3l-2 5z"/></svg>` },
      96: { desc: "Thunderstorm with Hail", icon: `<svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM11.5 22l2.5-5h-3l2-5h-2.5l-2 5h3l-2 5z"/></svg>` },
      99: { desc: "Heavy Thunderstorm with Hail", icon: `<svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM11.5 22l2.5-5h-3l2-5h-2.5l-2 5h3l-2 5z"/></svg>` }
    };

    const DEFAULT_WEATHER = {
      desc: "Overcast Clouds",
      icon: `<svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>`
    };

    function getWeatherInfo(code) {
      return WEATHER_INFO[code] || DEFAULT_WEATHER;
    }

    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function getNearestMetro(lat, lon) {
      let closest = MAJOR_METROS[0];
      let minDistance = Infinity;
      for (const metro of MAJOR_METROS) {
        const dist = getDistance(lat, lon, metro.lat, metro.lon);
        if (dist < minDistance) {
          minDistance = dist;
          closest = metro;
        }
      }
      return closest;
    }

    // URL parameters support (e.g. ?unit=C or unit=F)
    const urlParams = new URLSearchParams(window.location.search);
    const unitParam = (urlParams.get('unit') || 'C').toUpperCase();
    const isFahrenheit = unitParam === 'F';

    // Clock formatted: THU, 05 NOV 2026, 02:12 PM
    function updateClock() {
      const now = new Date();
      const days = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
      const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];

      const dayName = days[now.getDay()];
      const d = String(now.getDate()).padStart(2, '0');
      const m = months[now.getMonth()];
      const y = now.getFullYear();

      let hours = now.getHours();
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12;
      const hStr = String(hours).padStart(2, '0');
      const minStr = String(now.getMinutes()).padStart(2, '0');

      document.getElementById('clock').textContent = `${dayName}, ${d} ${m} ${y}, ${hStr}:${minStr} ${ampm}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    async function displayMetroWeather(metro) {
      document.getElementById('city-name').textContent = metro.name;
      try {
        const tempUnitApi = isFahrenheit ? 'fahrenheit' : 'celsius';
        const weatherRes = await fetch(
          `https://api.open-meteo.com/v1/forecast?latitude=${metro.lat}&longitude=${metro.lon}&current=temperature_2m,weather_code&temperature_unit=${tempUnitApi}`
        );
        const weatherData = await weatherRes.json();
        const temp = Math.round(weatherData.current.temperature_2m);
        const info = getWeatherInfo(weatherData.current.weather_code);
        document.getElementById('weather-icon').innerHTML = info.icon;
        document.getElementById('temperature').textContent = `${temp}°${isFahrenheit ? 'F' : 'C'}`;
        document.getElementById('condition-desc').textContent = info.desc;
      } catch (e) {
        document.getElementById('temperature').textContent = `--°${isFahrenheit ? 'F' : 'C'}`;
        document.getElementById('condition-desc').textContent = "Weather Unavailable";
      }
    }

    async function resolveViaWiFiOrIP() {
      try {
        const res = await fetch("https://ipwho.is/");
        const data = await res.json();
        if (data && data.success && data.latitude && data.longitude) {
          const metro = getNearestMetro(data.latitude, data.longitude);
          displayMetroWeather(metro);
          return;
        }
      } catch (err) {
        console.warn("Wi-Fi/IP lookup failed:", err);
      }
      displayMetroWeather(MAJOR_METROS[0]);
    }

    function updateLocationAndWeather() {
      if (!navigator.geolocation) {
        resolveViaWiFiOrIP();
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          const metro = getNearestMetro(lat, lon);
          displayMetroWeather(metro);
        },
        () => {
          resolveViaWiFiOrIP();
        },
        {
          enableHighAccuracy: false,
          timeout: 6000,
          maximumAge: 600000
        }
      );
    }

    updateLocationAndWeather();
    setInterval(updateLocationAndWeather, 600000);
  </script>
</body>
</html>
